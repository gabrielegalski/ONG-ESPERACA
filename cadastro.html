<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - ONG Esperança</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="cabecalho-principal">
      <h1 class="logo">ONG Esperança</h1>

      <!-- 1. O truque do Checkbox invisível -->
      <input type="checkbox" id="menu-toggle" class="menu-invisivel" />

      <!-- 2. O ícone do Hambúrguer -->
      <label for="menu-toggle" class="icone-hamburguer"> ☰ </label>

      <!-- 3. A Navegação com o link de Cadastro incluído -->
      <nav class="menu-navegacao">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="projetos.html">Projetos</a></li>

          <!-- Item com Submenu (Dropdown) de Doações -->
          <li class="item-dropdown">
            <a href="#">Doações ▾</a>
            <ul class="submenu">
              <li><a href="#">Dinheiro</a></li>
              <li><a href="#">Roupas</a></li>
            </ul>
          </li>

          <!-- Link direto para a página de Cadastro de Voluntários -->
          <li><a href="cadastro.html">Cadastro</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>Cadastro</h1>
      <form>
        <fieldset>
          <legend>dados pessoais</legend>

          <label for="nome">Nome Completo:</label>
          <input
            type="text"
            id="nome"
            name="nome"
            required
            placeholder="Digite seu nome"
          />
          <br /><br />

          <label for="cpf">CPF:</label>
          <input
            type="text"
            id="cpf"
            name="cpf"
            required
            pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
            placeholder="000.000.000-00"
            title="Digite o CPF no formato 000.000.000-00"
          />
          <br /><br />
          <label for="email">E-mail Institucional ou Pessoal:</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="contato@exemplo.com"
          />
          <br /><br />

          <label for="telefone">Telefone (WhatsApp):</label>
          <input
            type="tel"
            id="telefone"
            name="telefone"
            required
            pattern="\(\d{2}\) \d{4,5}-\d{4}"
            placeholder="(00) 00000-0000"
          />
          <br /><br />
          <label for="cep">CEP:</label>
          <input
            type="text"
            id="cep"
            name="cep"
            required
            pattern="\d{5}-\d{3}"
            placeholder="00000-000"
            title="Digite o CEP no formato 00000-000"
          />
          <br /><br />
        </fieldset>
        <button type="submit">Cadastrar Voluntário</button>
      </form>
    </main>
    <footer>
      <p>&copy; 2026 ONG Esperança - Todos os direitos reservados.</p>
    </footer>
  </body>
</html>
